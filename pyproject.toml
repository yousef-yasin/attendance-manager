[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attendance-manager"
dynamic = ["version"]
description = "Offline Windows desktop app for university instructors to manage course attendance from Excel files."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Attendance Manager Team" }]
dependencies = [
    "PySide6>=6.6",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "mypy>=1.10",
    "pyinstaller>=6.5",
    "pillow>=10",
    "xlwt>=1.3",
]

[project.gui-scripts]
attendance-manager = "attendance_manager.app:main"

[tool.setuptools.dynamic]
version = { attr = "attendance_manager.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
attendance_manager = ["ui/assets/*", "locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RUF012", "SIM108"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["attendance_manager"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "attendance_manager.ui.*"
disallow_untyped_defs = false
